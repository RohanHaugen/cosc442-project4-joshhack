name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
        
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run JUnit regression tests
        run: ./mvnw test

      # Add PIT mutation testing later
      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Run SpotBugs static analysis
        run: ./mvnw compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      # Add PIT report artifact upload later
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
